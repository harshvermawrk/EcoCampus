
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoCampus | Sustainable Campus</title>
  <link rel="stylesheet" href="css/style.css">

  <script defer src="js/storage.js"></script>
  <script defer src="js/seed.js"></script>
  <script defer src="js/dashboard.js"></script>
  <script defer src="js/complaints.js"></script>
  <script defer src="js/lab.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="#" class="brand" data-page="dashboard">🌱 EcoCampus</a>
    <span class="demo-badge">DEMO MODE</span>
  </header>

  <div class="app-layout">
    <nav class="sidebar">
      <button class="nav-link active" data-page="dashboard">Dashboard</button>
      <button class="nav-link" data-page="complaints">Green Complaint Box</button>
      <button class="nav-link" data-page="lab">Sustainable Lab</button>
    </nav>

    <main class="main-content">
      <div class="demo-notice">
        Demo data is simulated, not live campus measurements.
      </div>

      <section id="dashboard-page" class="page">
        <h1>Sustainability Dashboard</h1>
        <div id="dashboard-root"></div>
      </section>

      <section id="complaints-page" class="page" hidden>
        <h1>Green Complaint Box</h1>
        <div id="complaints-root"></div>
      </section>

      <section id="lab-page" class="page" hidden>
        <h1>Sustainable Lab</h1>
        <div id="lab-root"></div>
      </section>
    </main>
  </div>
</body>
</html>
