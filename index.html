
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A browser-based campus sustainability demo for reporting issues, tracking resource use, and building greener habits.">
  <meta name="theme-color" content="#116638">
  <title>EcoCampus | Sustainable Campus</title>
  <link rel="stylesheet" href="css/style.css">

  <script defer src="js/storage.js"></script>
  <script defer src="js/seed.js"></script>
  <script defer src="js/dashboard.js"></script>
  <script defer src="js/complaints.js"></script>
  <script defer src="js/lab.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="topbar">
    <a href="#dashboard-page" class="brand" data-page="dashboard">🌱 EcoCampus</a>
    <span class="demo-badge" aria-label="Demo mode">DEMO MODE</span>
  </header>

  <div class="app-layout">
    <nav class="sidebar" aria-label="Main navigation">
      <button class="nav-link active" data-page="dashboard" aria-controls="dashboard-page" aria-current="page">Dashboard</button>
      <button class="nav-link" data-page="complaints" aria-controls="complaints-page">Green Complaint Box</button>
      <button class="nav-link" data-page="lab" aria-controls="lab-page">Sustainable Lab</button>
    </nav>

    <main id="main-content" class="main-content" tabindex="-1">
      <div class="demo-notice" role="note">
        Demo data is simulated, not live campus measurements.
      </div>

      <section id="dashboard-page" class="page" aria-labelledby="dashboard-title">
        <h1 id="dashboard-title">Sustainability Dashboard</h1>
        <div id="dashboard-root"></div>
      </section>

      <section id="complaints-page" class="page" aria-labelledby="complaints-title" hidden>
        <h1 id="complaints-title">Green Complaint Box</h1>
        <div id="complaints-root"></div>
      </section>

      <section id="lab-page" class="page" aria-labelledby="lab-title" hidden>
        <h1 id="lab-title">Sustainable Lab</h1>
        <div id="lab-root"></div>
      </section>
    </main>
  </div>
</body>
</html>
